name: Session Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Bus2 session
        env:
          ONIBUS_API_BASE: ${{ secrets.ONIBUS_API_BASE }}
          ONIBUS_API_KEY: ${{ secrets.ONIBUS_API_KEY }}
        run: node worker.js
