name: Session Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bus2-session-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deliver session
        env:
          ONIBUS_API_BASE: ${{ secrets.ONIBUS_API_BASE }}
          BUS2_SESSION_UPDATE_KEY: ${{ secrets.BUS2_SESSION_UPDATE_KEY }}
          BUS2_RID: ${{ secrets.BUS2_RID }}
        run: node scripts/refresh.js
