name: Waze Manaus

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: waze-manaus
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Coletar Waze Manaus
        env:
          ONIBUS_API_BASE: ${{ secrets.ONIBUS_API_BASE }}
          WAZE_UPDATE_KEY: ${{ secrets.WAZE_UPDATE_KEY }}
        run: node scripts/waze.js
